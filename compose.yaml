name: sports-tournament

services:
  # Local AWS. Everything AWS-shaped answers on :4566 — see specs/02-floci-local-aws.md
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      # Without this, Floci returns localhost URLs that other containers cannot reach.
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_DEFAULT_REGION: us-east-1
    volumes:
      # Required for Docker-backed services (Lambda, RDS, ECS, EC2).
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    # Floci serves LocalStack-parity endpoints: GET /_localstack/health reports service
    # status. No healthcheck is declared here because the image's shell/curl contents are
    # unverified — check with `curl localhost:4566/_localstack/health` once the stack is up.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament
      POSTGRES_DB: tournament
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://tournament:tournament@postgres:5432/tournament
      # Service name, not localhost: containers resolve each other by name.
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend/src:/app/src
    command: ["uvicorn", "tournament.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
